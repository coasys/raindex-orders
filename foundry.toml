[profile.default]
src = "src"
out = "out"
# Every Solidity dependency is a Soldeer package pinned below, as in
# rain.orderbook itself; no git submodules remain.
libs = ["dependencies"]

solc = "0.8.25"
evm_version = "cancun"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

# Needed for dotrain compose
ffi = true

# One remapping per package, as Soldeer would write them, and the two names
# this repo's own files import by. The packages' own imports name their
# directory under dependencies/, as `raindex-interface-0.1.7/src/...`.
auto_detect_remappings = false
remappings = [
    "forge-std/=dependencies/forge-std-1.16.2/src/",
    "openzeppelin-contracts/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
    "@openzeppelin-contracts-5.6.1/=dependencies/@openzeppelin-contracts-5.6.1/",
    "forge-std-1.16.2/=dependencies/forge-std-1.16.2/",
    "raindex-0.1.15/=dependencies/raindex-0.1.15/",
    "raindex-interface-0.1.7/=dependencies/raindex-interface-0.1.7/",
    "rainlang-0.2.6/=dependencies/rainlang-0.2.6/",
    "rainlang-interface-0.2.9/=dependencies/rainlang-interface-0.2.9/",
    "rain-math-float-0.2.1/=dependencies/rain-math-float-0.2.1/",
]

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
# The Raindex V6 and Rainlang interfaces rain.orderbook 0.1.15 pins, and the
# decimal float every V6 amount is.
raindex-interface = "0.1.7"
rainlang-interface = "0.2.9"
rain-math-float = "0.2.1"
# The releases Rain deployed: their frozen src/generated/<tag>/ files carry the
# deterministic addresses src/Constants.sol takes.
raindex = "0.1.15"
rainlang = "0.2.6"

[soldeer]
recursive_deps = false
remappings_generate = false

[fuzz]
runs = 1024
